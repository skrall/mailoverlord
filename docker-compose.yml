# Runs Mailoverlord against a database of your choice, one profile per engine:
#
#   ./mvnw spring-boot:build-image          # produces the image this file references
#   cp .env.example .env                    # then set MAILOVERLORD_PASSWORD and a DB password
#   docker compose --profile postgres up
#
# The engines are postgres, mysql, mariadb, oracle, mssql and h2 (h2 runs the app alone, with
# its data on a volume). Only the app's ports are published, and only on the host's loopback:
# the database stays on the compose network and is never reachable from outside. The
# management port 8090 carries the actuator endpoints (see #72), so it is published the same
# loopback-only way: reachable from the host, from nowhere else.
#
# Two more profiles exercise the app's non-default authentication modes against a throwaway
# Dex identity provider: `oidc` runs the app in mode: oidc against Dex, and `proxy` adds an
# oauth2-proxy in mode: header. Either combines with any engine profile. Compose profiles
# choose which services run, not another service's environment, so the app's mode is a
# variable; set it in .env or on the command line:
#
#   MAILOVERLORD_SECURITY_MODE=oidc   docker compose --profile h2 --profile oidc up
#   MAILOVERLORD_SECURITY_MODE=header docker compose --profile h2 --profile proxy up

x-app-common: &app-common
  image: ${MAILOVERLORD_IMAGE:-mailoverlord:2.0.0-SNAPSHOT}
  ports:
    - "127.0.0.1:8080:8080"
    - "127.0.0.1:2025:2025"
    # The actuator management port, published loopback-only like the others: health, metrics
    # and the OPERATOR-guarded endpoints are read from the host at http://127.0.0.1:8090.
    - "127.0.0.1:8090:8090"
  # The image is distroless (no shell, no curl), so the check execs the Paketo health checker
  # directly. /workspace/health-check comes from the health-checker buildpack (pom.xml); its
  # THC_* target is set in x-app-env below, because a Docker healthcheck execs outside the CNB
  # launcher and so does not inherit launcher-provided env. start_period covers the JVM plus
  # schema setup before the first probe counts.
  healthcheck:
    test: ["CMD", "/workspace/health-check"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 30s

# Shared environment for every app container. MAILOVERLORD_PASSWORD is required because the
# image's built-in default is a published value; the DB passwords are optional so that running
# one profile does not force you to set the others, and the database container itself refuses to
# start without its own password.
#
# The app defaults to loopback binds (server.address / mailoverlord.smtp.bind-address /
# management.server.address in application.yml). The image bakes a 0.0.0.0 override so the
# published ports work, but the binds are stated here anyway: they make the file self-sufficient
# against an image built before that, and they document what the container needs.
x-app-env: &app-env
  MAILOVERLORD_PASSWORD: ${MAILOVERLORD_PASSWORD:?set MAILOVERLORD_PASSWORD in .env}
  SERVER_ADDRESS: "0.0.0.0"
  MAILOVERLORD_SMTP_BIND_ADDRESS: "0.0.0.0"
  MANAGEMENT_SERVER_ADDRESS: "0.0.0.0"
  # Pointed at the management plane's loopback health endpoint. THC_USE_LOOPBACK_ADDRESS keeps
  # the probe on 127.0.0.1 rather than whatever "localhost" resolves to in the container.
  THC_PORT: "8090"
  THC_PATH: "/actuator/health"
  THC_USE_LOOPBACK_ADDRESS: "true"
  #
  # Authentication. The engine profiles leave MODE at the basic default and never read the
  # rest; the oidc and proxy profiles flip the mode and use these values, so the same app
  # services serve all three modes. See the README's authentication sections.
  MAILOVERLORD_SECURITY_MODE: ${MAILOVERLORD_SECURITY_MODE:-basic}
  MAILOVERLORD_SECURITY_ROLES_CLAIM: ${MAILOVERLORD_SECURITY_ROLES_CLAIM:-groups}
  MAILOVERLORD_SECURITY_OPERATOR_GROUPS: ${MAILOVERLORD_SECURITY_OPERATOR_GROUPS:-mailoverlord-operators}
  # Header mode. oauth2-proxy puts X-Forwarded-User and X-Forwarded-Groups on the requests it
  # forwards (these are request headers in proxy mode; the X-Auth-Request-* pair is response
  # only), and the app believes them only from the proxy's fixed address on authnet below.
  MAILOVERLORD_SECURITY_HEADER: ${MAILOVERLORD_SECURITY_HEADER:-X-Forwarded-User}
  MAILOVERLORD_SECURITY_GROUPS_HEADER: ${MAILOVERLORD_SECURITY_GROUPS_HEADER:-X-Forwarded-Groups}
  MAILOVERLORD_SECURITY_TRUSTED_PROXIES: ${MAILOVERLORD_SECURITY_TRUSTED_PROXIES:-172.31.240.20/32}
  # issuer; the container talks to the same dex by service name for token, keys and userinfo.
  # issuer-uri is deliberately absent, so nothing is fetched (or required to be up) at startup,
  # which is what lets basic and header runs carry this config inertly.

services:
  # ---------------------------------------------------------------- postgres
  postgres:
    profiles: [postgres]
    image: postgres:17
    environment:
      POSTGRES_DB: mailoverlord
      POSTGRES_USER: mailoverlord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - mailoverlord-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailoverlord -d mailoverlord"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailoverlord-postgres:
    <<: *app-common
    profiles: [postgres]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      # The app defaults to the H2 driver (application.yml pins it), so a profile that points
      # elsewhere must state the driver explicitly, like the test suite's DB_DRIVER.
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mailoverlord
      SPRING_DATASOURCE_USERNAME: mailoverlord
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-}
    # The auth pieces live on authnet; the alias there is what oauth2-proxy's upstream names,
    # so it does not change with the engine. See the network at the foot of this file.
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_CLIENT_ID: mailoverlord
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_CLIENT_SECRET: mailoverlord-dex-secret
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_PROVIDER: dex
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_REDIRECT_URI: http://localhost:8080/login/oauth2/code/dex
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_SCOPE: openid,profile,email,groups
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_AUTHORIZATION_URI: http://localhost:5556/dex/auth
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_TOKEN_URI: http://dex:5556/dex/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_JWK_SET_URI: http://dex:5556/dex/keys
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_USER_INFO_URI: http://dex:5556/dex/userinfo
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_USER_NAME_ATTRIBUTE: preferred_username

    networks:
      default:
      authnet:
        aliases: [mailoverlord]

  # ------------------------------------------------------------------- mysql
  mysql:
    profiles: [mysql]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mailoverlord
      MYSQL_USER: mailoverlord
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
    volumes:
      - mailoverlord-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mailoverlord-mysql:
    <<: *app-common
    profiles: [mysql]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *app-env
      # allowPublicKeyRetrieval: connector/J 8+ needs it for caching_sha2_password over a
      # non-TLS socket, which is what the compose network is.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mailoverlord?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: mailoverlord
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_CLIENT_ID: mailoverlord
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_CLIENT_SECRET: mailoverlord-dex-secret
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_PROVIDER: dex
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_REDIRECT_URI: http://localhost:8080/login/oauth2/code/dex
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_SCOPE: openid,profile,email,groups
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_AUTHORIZATION_URI: http://localhost:5556/dex/auth
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_TOKEN_URI: http://dex:5556/dex/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_JWK_SET_URI: http://dex:5556/dex/keys
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_USER_INFO_URI: http://dex:5556/dex/userinfo
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_USER_NAME_ATTRIBUTE: preferred_username

  # ----------------------------------------------------------------- mariadb
  mariadb:
    profiles: [mariadb]
    image: mariadb:11
    environment:
      MARIADB_DATABASE: mailoverlord
      MARIADB_USER: mailoverlord
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-}
    volumes:
      - mailoverlord-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mailoverlord-mariadb:
    <<: *app-common
    profiles: [mariadb]
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/mailoverlord
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: mailoverlord
      SPRING_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD:-}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_CLIENT_ID: mailoverlord
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_CLIENT_SECRET: mailoverlord-dex-secret
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_PROVIDER: dex
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_REDIRECT_URI: http://localhost:8080/login/oauth2/code/dex
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_SCOPE: openid,profile,email,groups
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_AUTHORIZATION_URI: http://localhost:5556/dex/auth
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_TOKEN_URI: http://dex:5556/dex/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_JWK_SET_URI: http://dex:5556/dex/keys
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_USER_INFO_URI: http://dex:5556/dex/userinfo
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_USER_NAME_ATTRIBUTE: preferred_username

    networks:
      default:
      authnet:
        aliases: [mailoverlord]

  # ------------------------------------------------------------------ oracle
  oracle:
    profiles: [oracle]
    image: gvenzl/oracle-free:23-slim
    environment:
      # The SYS password and the APP_USER password are the same value here; set a second
      # variable if you would rather they differ.
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      APP_USER: mailoverlord
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-}
    volumes:
      - mailoverlord-oracle:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  mailoverlord-oracle:
    <<: *app-common
    profiles: [oracle]
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: oracle.jdbc.OracleDriver
      SPRING_DATASOURCE_USERNAME: mailoverlord
      SPRING_DATASOURCE_PASSWORD: ${ORACLE_PASSWORD:-}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_CLIENT_ID: mailoverlord
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_CLIENT_SECRET: mailoverlord-dex-secret
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_PROVIDER: dex
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_REDIRECT_URI: http://localhost:8080/login/oauth2/code/dex
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_SCOPE: openid,profile,email,groups
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_AUTHORIZATION_URI: http://localhost:5556/dex/auth
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_TOKEN_URI: http://dex:5556/dex/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_JWK_SET_URI: http://dex:5556/dex/keys
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_USER_INFO_URI: http://dex:5556/dex/userinfo
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_USER_NAME_ATTRIBUTE: preferred_username

    networks:
      default:
      authnet:
        aliases: [mailoverlord]

  # ------------------------------------------------------------------- mssql
  mssql:
    profiles: [mssql]
    # amd64 only. There is no arm64 image, so on Apple Silicon this needs emulation.
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
    volumes:
      - mailoverlord-mssql:/var/opt/mssql
    # The image's entrypoint runs sqlservr and nothing else, and the app connects to a
    # databaseName=mailoverlord that does not otherwise exist, so this starts the server in the
    # background, waits for it to answer, and creates the database. The healthcheck below
    # additionally requires the database to exist, so depends_on: service_healthy guarantees the
    # app will find it. The trailing wait keeps sqlservr under this shell as the container's
    # foreground process.
    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &
        for i in $$(seq 1 120); do
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1 && break
          sleep 1
        done
        /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" \
          -Q "IF DB_ID('mailoverlord') IS NULL CREATE DATABASE mailoverlord"
        wait
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"IF DB_ID('mailoverlord') IS NULL THROW 50000, 'mailoverlord not created yet', 1\""]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  mailoverlord-mssql:
    <<: *app-common
    profiles: [mssql]
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      <<: *app-env
      # mssql-jdbc 10+ encrypts by default; the server's certificate is self-signed, so trust it
      # rather than negotiating TLS on the internal network.
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://mssql:1433;databaseName=mailoverlord;encrypt=false;trustServerCertificate=true"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.microsoft.sqlserver.jdbc.SQLServerDriver
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${MSSQL_SA_PASSWORD:-}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_CLIENT_ID: mailoverlord
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_CLIENT_SECRET: mailoverlord-dex-secret
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_PROVIDER: dex
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_REDIRECT_URI: http://localhost:8080/login/oauth2/code/dex
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_SCOPE: openid,profile,email,groups
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_AUTHORIZATION_URI: http://localhost:5556/dex/auth
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_TOKEN_URI: http://dex:5556/dex/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_JWK_SET_URI: http://dex:5556/dex/keys
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_USER_INFO_URI: http://dex:5556/dex/userinfo
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_USER_NAME_ATTRIBUTE: preferred_username

    networks:
      default:
      authnet:
        aliases: [mailoverlord]

  # ---------------------------------------------------------------------- h2
  # The app image already ships H2, so this profile has no database container: it is the app
  # with a volume mounted and the file URL pointed at it. The image runs as uid 1002 while Docker
  # creates the volume root-owned, so it has to run as root to write there. This is the least
  # durable option and the data should be treated as throwaway.
  mailoverlord-h2:
    <<: *app-common
    profiles: [h2]
    user: "0"
    volumes:
      - mailoverlord-h2:/data
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/data/mailoverlord;DB_CLOSE_ON_EXIT=FALSE"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_CLIENT_ID: mailoverlord
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_CLIENT_SECRET: mailoverlord-dex-secret
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_PROVIDER: dex
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_REDIRECT_URI: http://localhost:8080/login/oauth2/code/dex
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DEX_SCOPE: openid,profile,email,groups
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_AUTHORIZATION_URI: http://localhost:5556/dex/auth
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_TOKEN_URI: http://dex:5556/dex/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_JWK_SET_URI: http://dex:5556/dex/keys
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_USER_INFO_URI: http://dex:5556/dex/userinfo
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_DEX_USER_NAME_ATTRIBUTE: preferred_username

    networks:
      default:
      authnet:
        aliases: [mailoverlord]

  # -------------------------------------------------------- identity provider
  # Dex stands in for Okta or Entra in the oidc and proxy profiles. It sits on authnet only:
  # the app and oauth2-proxy reach it by service name, while the browser reaches it through
  # the published loopback port. The config is docker/dex/config.yaml.
  dex:
    profiles: [oidc, proxy]
    image: ghcr.io/dexidp/dex:v2.46.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./docker/dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "127.0.0.1:5556:5556"
    # Dex's healthz lives under the issuer path, and the image ships wget but no curl. Nothing
    # depends on this (the app starts fine without Dex and only fails a login without it), so
    # it is there for `docker compose ps` and for spotting a Dex that died.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:5556/dex/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - authnet

  # ------------------------------------------------------------------ reverse proxy
  # The edge of the proxy profile: oauth2-proxy signs the browser in against Dex and forwards
  # the request to the app with X-Forwarded-User/-Groups overwritten from the session. It holds
  # a fixed address on authnet so the app's trusted-proxies can name exactly this /32 — a
  # request that reaches the app's published port from anywhere else is answered 401. The
  # explicit endpoints replace discovery because Dex advertises the host-facing issuer, which
  # a container could not redeem a code against; backchannels use the service name instead.
  oauth2-proxy:
    profiles: [proxy]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    command:
      - --provider=oidc
      - --skip-oidc-discovery=true
      - --oidc-issuer-url=http://localhost:5556/dex
      - --insecure-oidc-skip-issuer-verification=true
      - --login-url=http://localhost:5556/dex/auth
      - --redeem-url=http://dex:5556/dex/token
      - --oidc-jwks-url=http://dex:5556/dex/keys
      - --client-id=mailoverlord
      - --client-secret=mailoverlord-dex-secret
      - --scope=openid email groups
      - --oidc-groups-claim=groups
      - --email-domain=*
      - --redirect-url=http://localhost:4180/oauth2/callback
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET:-3Y7bdRKsi7hCNAKS7Nuzw0-GaTfTvd_9L97K9Qi8DCI=}
      - --cookie-secure=false
      - --cookie-samesite=lax
      - --http-address=0.0.0.0:4180
      - --skip-provider-button=true
      - --upstream=http://mailoverlord:8080
    ports:
      - "127.0.0.1:4180:4180"
    depends_on:
      - dex
    networks:
      authnet:
        ipv4_address: 172.31.240.20

volumes:
  mailoverlord-postgres:
  mailoverlord-mysql:
  mailoverlord-mariadb:
  mailoverlord-oracle:
  mailoverlord-mssql:
  mailoverlord-h2:

networks:
  # A dedicated network for the auth pieces. oauth2-proxy needs a fixed address so the app's
  # trusted-proxies can name a stable /32, which the default network's dynamic addresses
  # cannot give. The app joins this and the default network (the databases stay on default)
  # and carries the `mailoverlord` alias here for the proxy to resolve.
  authnet:
    ipam:
      config:
        - subnet: 172.31.240.0/24