version: 2

updates:
  # The container images the compose profiles run: postgres, mysql, mariadb, oracle,
  # mssql, dex and oauth2-proxy. Six of those are upstream infrastructure where a
  # breaking major is plausible and invisible until someone runs the profile. This is a
  # separate ecosystem from `docker` on purpose: `docker` looks for Dockerfiles and
  # Kubernetes manifests, and this project has neither — the image is produced by
  # spring-boot-maven-plugin through the Java buildpacks, not from a Dockerfile. Adding
  # `docker` would only produce "no dependency files found" on every run.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # This project's own image, built from this repository by the Maven build. The
      # ${...:-} default is a template for whoever is running a profile, and there is no
      # registry copy to follow.
      - dependency-name: "mailoverlord"

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 6 and 7 are both blocked, for different reasons.
      #
      # 6.x makes `npm ci` fail outright, which is what the Maven build runs:
      #   npm error Fix the upstream dependency conflict, or retry
      #   this command with --force or --legacy-peer-deps
      # because openapi-typescript peers on typescript ^5.x. Note that
      # `npm install` appears to succeed and only warns, so this looks
      # fine locally and still breaks the build.
      #
      # 7.x is the Go-based native compiler and does not export the ./lib/tsc
      # subpath that vue-tsc resolves to find the compiler, so the typecheck
      # step cannot start at all:
      #   ERR_PACKAGE_PATH_NOT_EXPORTED: Package subpath './lib/tsc' is not
      #   defined by "exports" in node_modules/typescript/package.json
      #
      # Revisit both once openapi-typescript widens its peer range and vue-tsc
      # supports the native compiler.
      - dependency-name: typescript
        versions: ["6.x", "7.x"]
      # @types/node tracks the Node major that actually runs the build. The
      # Maven build downloads node.version from pom.xml, currently v24.21.0,
      # and @types/node is only used for process.env in vite.config.ts. Taking
      # 25+ would describe a runtime the build does not use.
      - dependency-name: "@types/node"
        versions: ["25.x", "26.x"]
