version: 2

updates:
  # The container images the compose profiles run: postgres, mysql, mariadb, oracle,
  # mssql, dex and oauth2-proxy. Six of those are upstream infrastructure where a
  # breaking major is plausible and invisible until someone runs the profile. This is a
  # separate ecosystem from `docker` on purpose: `docker` looks for Dockerfiles and
  # Kubernetes manifests, and this project has neither — the image is produced by
  # spring-boot-maven-plugin through the Java buildpacks, not from a Dockerfile. Adding
  # `docker` would only produce "no dependency files found" on every run.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # This project's own image, built from this repository by the Maven build. The
      # ${...:-} default is a template for whoever is running a profile, and there is no
      # registry copy to follow.
      - dependency-name: "mailoverlord"

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # typescript 6.x is what the build uses, but openapi-typescript still peers
    # on ^5.x, so package.json carries an `overrides` entry that resolves the
    # peer with "$typescript". `npm ci` therefore passes; `npm install` alone
    # only warns about the same conflict, which is why it once looked fine
    # locally while breaking the build. Preserve that override in any PR that
    # touches the lockfile.
    #
    # Dependabot's npm updates handle overrides by re-reading package.json, so
    # open minor/patch bumps flow normally.
    ignore:
      # TypeScript 7 is blocked. It is the native compiler and does not export
      # the ./lib/tsc subpath that vue-tsc resolves to find the compiler, so
      # the typecheck step cannot start at all:
      #   ERR_PACKAGE_PATH_NOT_EXPORTED: Package subpath './lib/tsc' is not
      #   defined by "exports" in node_modules/typescript/package.json
      # Lift once vue-tsc supports the native compiler.
      - dependency-name: typescript
        versions: ["7.x"]
      # @types/node tracks the Node major that actually runs the build. The
      # Maven build downloads node.version from pom.xml, currently v26.13.0,
      # and @types/node is only used for process.env in vite.config.ts. Taking
      # 27+ would describe a runtime the build does not use. Bump this line
      # in lockstep with node.version.
      - dependency-name: "@types/node"
        versions: ["27.x"]
