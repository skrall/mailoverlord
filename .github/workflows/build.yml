name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify
        run: ./mvnw -B --batch-mode verify

      # The UI's types are generated from the OpenAPI document, so a DTO change that nobody
      # regenerated the types for would otherwise slip through and only fail in an editor.
      # Regenerating here turns that into a build failure.
      - name: Check the generated API types are up to date
        run: |
          cd ui
          npm ci
          npm run generate:spec
          npm run generate:types
          cd ..
          git diff --exit-code -- ui/openapi.json ui/src/api/schema.d.ts
