spring:
  application:
    name: mailoverlord

  mvc:
    # RFC 9457 error bodies. Without this the error statuses come back with no body at
    # all, so the reason a request was rejected is only visible in the servlet response's
    # error message and never reaches the client.
    problemdetails:
      enabled: true

  # Captured mail is valuable during a test run, so never drop the schema out from
  # under it. Hibernate adds any missing tables and columns on startup.
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  datasource:
    url: jdbc:h2:mem:mailoverlord;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  # Where released messages get sent. This defaults to the usual SMTP port on localhost.
  # Set the port to 2025 to send released mail back to mailoverlord's own listener and
  # re-capture it, which is handy for testing a release.
  mail:
    host: localhost
    port: 25

# Loopback only: the SMTP server is bound to 127.0.0.1 so that mailoverlord does not accept
# arbitrary incoming mail on an open port. On a host that needs to receive from elsewhere,
# override SERVER_ADDRESS and MAILOVERLORD_SMTP_BIND_ADDRESS as environment variables.
server:
  address: 127.0.0.1

mailoverlord:
  smtp:
    port: 2025
    bind-address: 127.0.0.1

logging:
  level:
    org.mailoverlord: INFO
