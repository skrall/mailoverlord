# The single identity the UI signs in with. This is an OPERATOR: it can read, release
# and delete. Override MAILOVERLORD_PASSWORD or spring.security.user.password; leaving
# this default in place means everyone who can reach mailoverlord's port can sign in.
spring:
  application:
    name: mailoverlord

  security:
    user:
      name: operator
      password: ${MAILOVERLORD_PASSWORD:${SPRING_SECURITY_USER_PASSWORD:change-me-on-deploy}}

  mvc:
    # RFC 9457 error bodies. Without this the error statuses come back with no body at
    # all, so the reason a request was rejected is only visible in the servlet response's
    # error message and never reaches the client.
    problemdetails:
      enabled: true

  # Captured mail is valuable during a test run, so never drop the schema out from
  # under it. Hibernate adds any missing tables and columns on startup.
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  datasource:
    url: jdbc:h2:mem:mailoverlord;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  # Where released messages get sent. This defaults to the usual SMTP port on localhost.
  # Set the port to 2025 to send released mail back to mailoverlord's own listener and
  # re-capture it, which is handy for testing a release.
  mail:
    host: localhost
    port: 25

# Loopback only: the SMTP server is bound to 127.0.0.1 so that mailoverlord does not accept
# arbitrary incoming mail on an open port. On a host that needs to receive from elsewhere,
# override SERVER_ADDRESS and MAILOVERLORD_SMTP_BIND_ADDRESS as environment variables.
# For mode: header, keep the app on an address only the proxy can reach and add
#   server.forward-headers-strategy: framework
# so the header source check uses the real connection peer rather than a spoofable header.
server:
  address: 127.0.0.1

# The management plane (actuator) runs on its own loopback-only port, separate from the
# application port, so an attacker who reaches :8080 never sees an actuator route. The
# Docker image and profiles publish 127.0.0.1:8090 so an operator can read health, metrics
# and the rest from the host. See #72.
management:
  server:
    port: 8090
    address: 127.0.0.1
  health:
    # The mail indicator probes the release target (spring.mail.*) at health time. That
    # server is optional and often absent (the Docker profiles have no MTA on port 25), so
    # reporting DOWN every time it is not up would drown the checks that matter. DB and disk
    # availability are what tell an operator the app itself is alive.
    mail:
      enabled: false
  endpoints:
    web:
      # Anything useful for a live install is enabled; the endpoints that take or hand over
      # state are protected by role in SecurityConfig rather than unregistered, so their
      # availability is visible on this page.
      exposure:
        include: "*"
  endpoint:
    health:
      # The health page is what an operator reads from the host, so it shows the database
      # and disk checks rather than a bare UP. The management port is loopback-only, which
      # is what makes the details safe to expose without credentials.
      show-details: always

mailoverlord:
  smtp:
    port: 2025
    bind-address: 127.0.0.1

  # Every request needs HTTP Basic authentication. The documented user is the
  # spring.security.user identity; add names to the operator/viewer lists to hand that
  # shared password to others with a narrower role. Set mode to "oidc" to sign browsers in
  # against an identity provider, to "header" to trust the identity a reverse proxy asserts
  # (both documented in the README), or to "none" only to run with no authentication at all,
  # which is what the test suite does.
  security:
    mode: basic
    operator-users: []
    viewer-users: []

  # With mode: oidc the role claim and the operator groups decide who may release/delete.
  # roles-claim: groups        # Okta default; use "roles" for Microsoft Entra ID
  # operator-groups: []

  # With mode: header the reverse proxy signs people in and sets these two headers, and the
  # allowlist says whose connections the identity is believed on. Startup refuses mode:
  # header without both a header and an allowlist, on purpose: a header nobody vouches for
  # would be one line of forgery away.
  #   header: X-Auth-Request-User
  #   groups-header: X-Auth-Request-Groups
  #   trusted-proxies: [127.0.0.1/32]

# OIDC client registration, for mode: oidc. The provider endpoints are read from
# issuer-uri, so Okta and Entra ID differ only by these lines. See the README's
# "Browser login against a provider (OIDC)" section.
# spring:
#   security:
#     oauth2:
#       client:
#         registration:
#           okta:
#             client-id: {the-client-id}
#             client-secret: {the-client-secret}
#             provider: okta
#         provider:
#           okta:
#             issuer-uri: https://{your-domain}.okta.com/oauth2/default

logging:
  level:
    org.mailoverlord: INFO