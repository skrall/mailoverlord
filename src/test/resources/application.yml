spring:
  # Security is exercised by dedicated slice tests; the shared context here runs the
  # pre-security behaviour so the existing suite is untouched.
  security:
    user:
      name: operator
      # A fixed password, so a test can sign in as the documented user.
      password: ${MAILOVERLORD_PASSWORD:${SPRING_SECURITY_USER_PASSWORD:test-password}}

  datasource:
    # H2 in memory by default so the suite runs anywhere with no setup. Point these at
    # a real database to run the suite against it, e.g.
    #   DB_DRIVER=org.postgresql.Driver DB_URL=jdbc:postgresql://localhost/overlord \
    #   DB_USER=postgres DB_PASSWORD=secret mvn test
    url: ${DB_URL:jdbc:h2:mem:overlord;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      # Pinned so the suite behaves the same on every engine, which is the whole point of
      # the database matrix. The default is not uniform: MySQL hands out REPEATABLE READ
      # while PostgreSQL and H2 use READ COMMITTED, and the tests depend on the weaker one.
      #
      # The dependency is real. Messages reach the database asynchronously, on the SMTP
      # handler thread, committing in its own transaction. The test then queries from a
      # transaction that opened before that commit landed. Under REPEATABLE READ that
      # query is served from a snapshot taken too early and returns nothing, so tests fail
      # with "expected size 1 but was 0" against a database that is working perfectly.
      transaction-isolation: TRANSACTION_READ_COMMITTED

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  # Released messages are sent back to mailoverlord's own SMTP port so the tests can
  # assert on what was re-captured.
  mail:
    host: localhost
    port: 2025

mailoverlord:
  security:
    # The shared context runs every security mode off: the filter chain this selects
    # reproduces the pre-security behaviour, so nothing in the existing suite changes.
    mode: none

  retention:
    # Stated rather than left to the built-in default, and deliberately so: the retention tests
    # exercise a cap, and a cap in this property would put a scheduled sweep into the shared
    # context where it could delete another test's mail mid-assertion. They build a capped
    # service directly instead, which touches no context at all.
    #
    # This is also why no retention test may use @TestPropertySource. The embedded SMTP server
    # binds a fixed port at startup, so a second context would fight the first for it and both
    # would share jdbc:h2:mem:overlord — two contexts interleaving deleteAll against each
    # other's rows, which fails as data vanishing mid-test rather than as anything obvious.
    max-messages: -1
